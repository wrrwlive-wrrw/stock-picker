<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智能选股">
  <meta name="description" content="智能选股指导系统 — AI驱动的A股投资分析平台">
  <title>智能选股指导系统</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 登录页 -->
  <div class="login-page" id="loginPage">
    <div class="login-box">
      <div class="login-header">
        <h1>📈 智能选股指导系统</h1>
        <p>请登录后使用</p>
      </div>
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="loginUser" placeholder="请输入账号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPwd" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-login" onclick="doLogin()">登 录</button>
      <div class="login-tip">请使用分配的账号登录</div>
    </div>
  </div>

  <!-- 顶部导航 -->
  <nav class="top-nav" id="topNav" style="display:none">
    <div class="nav-left" style="display:flex;align-items:center">
      <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">☰</button>
      <span class="logo">📈 智能选股</span>
    </div>
    <div class="nav-right">
      <span class="market-time" id="marketTime"></span>
      <span id="userInfo" style="margin-left:12px"></span>
      <button class="btn-logout" onclick="doLogout()">退出</button>
    </div>
  </nav>

  <!-- 侧边栏遮罩 -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- 主布局 -->
  <div class="app-container" id="appContainer" style="display:none">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="mainContent"></main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/market.js"></script>
  <script src="js/methodology.js"></script>
  <script src="js/macro.js"></script>
  <script src="js/stock-query.js"></script>
  <script src="js/stock-analysis.js"></script>
  <script src="js/strategy.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/trade-signal.js"></script>
  <script src="js/watchlist.js"></script>
  <script src="js/daily-ai.js"></script>
  <script src="js/ai-stock-agent.js"></script>
  <script src="js/daily-report.js"></script>
  <script src="js/video-research.js"></script>
</body>
</html>
